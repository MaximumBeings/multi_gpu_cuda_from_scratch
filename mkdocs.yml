site_name: Multi-GPU Programming in CUDA C++ -- Under Development
site_description: From Peer-to-Peer Memory to Distributed Training Across the Cluster
site_author: Oluwaseyi Awoga
copyright: Copyright &copy; 2026 Oluwaseyi Awoga

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    logo: material/server-network

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - footnotes

plugins:
  - search

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - "Part 0 -- Why Multi-GPU, and the Hardware Underneath It":
      - "1. Why One GPU Is Not Enough": part0/01-why-one-gpu-is-not-enough.md
      - "2. Multi-GPU Hardware Topology: PCIe, NVLink, and NVSwitch": part0/02-multi-gpu-hardware-topology.md
      - "3. The CUDA Multi-GPU Programming Model: Devices, Contexts, and Streams Across Them": part0/03-the-cuda-multi-gpu-programming-model.md
  - "Part 1 -- Getting Data Between GPUs":
      - "4. Peer-to-Peer Memory Access and Unified Virtual Addressing": part1/04-peer-to-peer-memory-access-and-uva.md
      - "5. Explicit Transfers: cudaMemcpyPeer, Staged Host Transfers, and When Each Wins": part1/05-explicit-transfers-cudamemcpypeer-staged-host-transfers.md
      - "6. Streams, Events, and Cross-Device Synchronization": part1/06-streams-events-and-cross-device-synchronization.md
      - "7. CUDA Inter-Process Communication: Sharing Memory and Events Across Processes": part1/07-cuda-inter-process-communication.md
  - "Part 2 -- Collective Communication, Built From Scratch":
      - "8. Broadcast and Reduce: The First Two Collectives, By Hand": part2/08-broadcast-and-reduce-the-first-two-collectives-by-hand.md
      - "9. Ring All-Reduce: The Algorithm Behind Every Multi-GPU Training Job": part2/09-ring-all-reduce-the-algorithm-behind-every-multi-gpu-training-job.md
      - "10. All-Gather, Reduce-Scatter, and All-to-All": part2/10-all-gather-reduce-scatter-and-all-to-all.md
      - "11. NCCL: What It Actually Does Differently From What You Just Built": part2/11-nccl-what-it-actually-does-differently.md
  - "Part 3 -- Parallelization Strategies":
      - "12. Data Parallelism: Replicated Model, Sharded Data": part3/12-data-parallelism-replicated-model-sharded-data.md
      - "13. Model Parallelism: When One GPU Can't Hold the Weights": part3/13-model-parallelism-when-one-gpu-cant-hold-the-weights.md
      - "14. Tensor Parallelism: Splitting a Single Matrix Multiply Across Devices": part3/14-tensor-parallelism-splitting-a-single-matrix-multiply-across-devices.md
      - "15. Pipeline Parallelism: Splitting Layers Across Devices, and the Bubble That Costs You": part3/15-pipeline-parallelism-splitting-layers-across-devices-and-the-bubble-that-costs-you.md
      - "16. Domain Decomposition for Scientific Computing: Halo Exchange and Distributed Stencils": part3/16-domain-decomposition-for-scientific-computing-halo-exchange-and-distributed-stencils.md
  - "Part 4 -- Synchronization, Load Balancing, and Failure":
      - "17. Barriers and Global Synchronization Across Devices": part4/17-barriers-and-global-synchronization-across-devices.md
      - "18. Load Balancing Across Heterogeneous GPUs": part4/18-load-balancing-across-heterogeneous-gpus.md
      - "19. Stragglers, Failures, and Fault-Tolerant Collectives": part4/19-stragglers-failures-and-fault-tolerant-collectives.md
  - "Part 5 -- Scaling Beyond One Node":
      - "20. MPI From Scratch, Then CUDA-Aware MPI: Scaling Beyond One Node": part5/20-mpi-from-scratch-then-cuda-aware-mpi-scaling-beyond-one-node.md
      - "21. GPUDirect RDMA: Bypassing the Host Entirely": part5/21-gpudirect-rdma-bypassing-the-host-entirely.md
      - "22. NVSHMEM and GPU-Initiated Communication": part5/22-nvshmem-and-gpu-initiated-communication.md
      - "23. CUDA Graphs Across Multiple GPUs and Multiple Nodes": part5/23-cuda-graphs-across-multiple-gpus-and-multiple-nodes.md
  - "Part 6 -- Case Studies":
      - "24. Multi-GPU Dense Matrix Multiplication at Scale": part6/24-multi-gpu-dense-matrix-multiplication-at-scale.md
      - "25. Distributed Training of a Neural Network: Data Parallelism and Ring All-Reduce": part6/25-distributed-training-of-a-neural-network-data-parallelism-and-ring-all-reduce.md
      - "26. Multi-GPU LLM Inference: Tensor and Pipeline Parallelism in Practice": part6/26-multi-gpu-llm-inference-tensor-and-pipeline-parallelism-in-practice.md

extra:
  social: []
