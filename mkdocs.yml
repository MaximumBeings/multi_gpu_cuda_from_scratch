      - "25. Distributed Training of a Neural Network: Data Parallelism and Ring All-Reduce": part6/25-distributed-training-data-parallel-allreduce.md
      - "26. Multi-GPU LLM Inference: Tensor and Pipeline Parallelism in Practice": part6/26-multi-gpu-llm-inference-tensor-pipeline-parallelism.md
      - "27. Multi-GPU N-Body Simulation": part6/27-multi-gpu-n-body-simulation.md
      - "28. Multi-GPU Graph Processing: Distributed Breadth-First Search": part6/28-multi-gpu-distributed-bfs.md
      - "29. A Distributed Jacobi Solver: Multi-GPU Scientific Computing With Halo Exchange": part6/29-distributed-jacobi-solver-halo-exchange.md
