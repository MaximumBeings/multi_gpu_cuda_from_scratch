name: Verify and deploy book
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r tools/illustrations/requirements.txt
      - name: Verify approved documentation views
        run: python3 tools/test_approved_display.py
      - name: Reject unregistered pending source changes
        run: python3 tools/test_pending_revalidation.py
      - name: Verify execution evidence
        run: python3 tools/verify_execution.py
      - name: Verify November 18 rerun claims
        run: python3 tools/verify_rerun.py
      - name: Verify corrected host models
        run: python3 tools/verify_host_corrections.py
      - name: Verify illustrations
        run: python3 tools/illustrations/validate.py
      - name: Build documentation strictly
        run: mkdocs build --strict
      - name: Check internal links and anchors
        run: python3 tools/verify_site_links.py
      - name: Verify displayed source formatting
        run: python3 tools/verify_code_formatting.py --site-dir site

      - name: Publish verified site
        run: mkdocs gh-deploy --force
